{% extends "layout.html" %}

{% block content %}

<div class="card mb-4 shadow-sm">
    <div class="card-body">
        
        <!-- Post Title -->
        <h1 class="mb-3">{{ post.title }}</h1>

        <!-- Author and Date Info -->
        <div class="text-muted mb-3">
            <small>
                By <span class="font-weight-bold">{{ post.Author_Name }}</span> 
                | 
                Published on {{ post.date_post }}
            </small>
        </div>

        <hr>

        <!-- Full Post Content (Quill.js HTML content safely rendered) -->
        <div class="post-full-content mt-4">
            {{ post.content | safe }}
        </div>

        <!-- Back to Home Button -->
        <div class="mt-4">
            <a href="{{ url_for('home') }}" class="btn btn-outline-secondary btn-sm">
                &larr; Back to Home
            </a>
        </div>

    </div>
</div>

{% endblock %}
