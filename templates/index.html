{% extends "layout.html" %}

{% block content %}

{% for post in posts %}

<div class="card mb-4 shadow-sm">

    <div class="card-body">

        <h2>{{ post.title }}</h2>

        <small class="text-muted">
            By {{ post.Author_Name }}
            |
            {{ post.date_post }}
        </small>

        <hr>

        <p>
            {{ post.content }}
        </p>

        <a href="#" class="btn btn-primary">
            Read More
        </a>

    </div>

</div>

{% endfor %}

{% endblock %}
