
{% extends "layout.html" %}
{%block content%}
    {% for post in posts%}
    <hr>
        <center><h1>{{ post.title }} </h1></center>
    <hr>
    <h3>Author Name : {{ post.Author_Name }} </h3>

    <br>
    <h3>Content</h3>
    <p>{{ post.content }}</p>
    <h4>Date of Post ::- {{post.date_post}} </h4>

    {%endfor %}
{%endblock content%}
